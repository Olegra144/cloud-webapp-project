name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create ZIP
      run: zip -r backend.zip .
      working-directory: ./backend

    - name: Deploy via Azure CLI
      uses: azure/CLI@v1
      with:
        inlineScript: |
          az functionapp deployment source config-zip \
            --resource-group webappproject_group \
            --name webappproject \
            --src backend/backend.zip
