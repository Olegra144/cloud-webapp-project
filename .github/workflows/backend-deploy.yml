name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: Azure/functions-action@v1
      with:
        app-name: YOUR_FUNCTIONAPP_NAME
        package: ./backend
        publish-profile:
          ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
