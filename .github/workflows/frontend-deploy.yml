name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: azure/webapps-deploy@v3
      with:
        app-name: YOUR_WEBAPP_NAME
        publish-profile:
          ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./frontend